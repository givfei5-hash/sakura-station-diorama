  s.lineTo(x+r,0);s.quadraticCurveTo(x,0,x,r);

const glassMats=[];
function glassMat(flip=1){
  const m=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,side:THREE.DoubleSide,
    uniforms:{uTime:{value:0},uTrain:{value:-1000},uTrain2:{value:-1000},uFlip:{value:flip},
      uBase:{value:new THREE.Color(0xcdeaf5)},uAlpha:{value:.24}},
    vertexShader:`uniform float uFlip;varying vec2 vUv;varying float vX;
      void main(){vUv=uv;vX=position.x*uFlip;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uTime,uTrain,uTrain2,uAlpha;uniform vec3 uBase;
      varying vec2 vUv;varying float vX;
      void main(){
        float b1=exp(-pow((vX-uTrain)/4.0,2.0));
        float b2=exp(-pow((vX-uTrain2)/5.0,2.0));
        float band=min(b1+b2,1.0)*0.45;
        float diag=0.05*sin(vX*0.4-uTime*0.5);
        vec3 col=mix(uBase,vec3(1.0),vUv.y*0.22+diag);
        col+=vec3(0.55,0.65,0.75)*band;
        float a=uAlpha+band+0.015*sin(vUv.x*36.0)+0.02*sin(vUv.y*24.0);
        gl_FragColor=vec4(col,clamp(a,0.0,0.92));
      }`});
  glassMats.push(m);return m;
}

function vending(x,y,z,ry,c1,c2,label){
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;
  const front=ctex(256,512,(c,w,h)=>{

      c.fillStyle=cols[(r+i)%3];c.fillRect(16+i*58,100+r*110,48,88);
      const can=pick(['#d9534f','#e8a33d','#4f9fd9','#7fb56a','#b06ad0','#e0705f']);
      c.fillStyle=can;c.beginPath();c.arc(40+i*58,144+r*110,15,0,6.28);c.fill();
      c.fillStyle='rgba(255,255,255,.5)';c.fillRect(26+i*58,120+r*110,8,30);

    c.fillStyle='#c9d2da';c.fillRect(w-96,458,40,32);
    c.fillStyle='#1c2126';c.fillRect(28,458,70,14);
  });
  const side=toonMat(0x3f4854),top=toonMat(0x5a6470);
  const fmat=toonMat(0xffffff,{map:front});

const clockHands=[];
function clockFace(){
  return ctex(256,256,(c,w,h)=>{
    c.fillStyle='#f7f5ef';c.beginPath();c.arc(128,128,126,0,7);c.fill();
    c.strokeStyle='#3a4148';c.lineWidth=8;c.beginPath();c.arc(128,128,118,0,7);c.stroke();
    for(let i=0;i<60;i++){const a=i/60*6.283,L=i%5===0?22:10;
      c.strokeStyle=i%5===0?'#333a41':'#9aa1a8';c.lineWidth=i%5===0?6:2.5;
      c.beginPath();c.moveTo(128+Math.sin(a)*(112-L),128-Math.cos(a)*(112-L));
      c.lineTo(128+Math.sin(a)*112,128-Math.cos(a)*112);c.stroke();}
    c.fillStyle='#5a636c';c.font='bold 26px "Segoe UI",Arial';c.textAlign='center';
    c.fillText('12',128,78);c.fillText('6',128,196);c.fillText('3',186,138);c.fillText('9',70,138);
  });
}
function clock(x,y,z,ry,rad=.55){
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;
  addT(g,U,toonMat(0x4a5560),0,0,0,{s:[rad*2.2,rad*2.2,.12]});
  const face=clockFace();
  const cg=new THREE.CircleGeometry(rad,32);
  const fm=new THREE.MeshBasicMaterial({map:face});
  addT(g,cg,fm,0,0,.065,{cs:false});
  const back=addT(g,cg,new THREE.MeshBasicMaterial({color:0xf0ede6}),0,0,-.065,{r:[0,Math.PI,0],cs:false});
  const mk=(wd,ln,col,off,zp)=>{
    const p=new THREE.Group();p.position.set(0,0,zp);g.add(p);
    addT(p,U,toonMat(col,{emissive:col,ei:.12}),0,off,0,{s:[wd,ln,.02]});
    return p;
  };
  const hr=mk(.07,.42,0x333a41,.15,.075);
  const mn=mk(.05,.6,0x333a41,.23,.082);
  const sc=mk(.025,.66,0xd24b4b,.24,.09);
  addT(g,new THREE.SphereGeometry(.045,8,8),toonMat(0x333a41),0,0,.09,{cs:false});
  clockHands.push({hr,mn,sc});
  scene.add(g);return g;
}

function sagWire(p1,p2,sag,pts=21,phase=0){

}

      const t=(x-ks[i][0])/(ks[i+1][0]-ks[i][0]);

function puddle(x,z,r){
  const geo=new THREE.CircleGeometry(r,40);geo.rotateX(-Math.PI/2);

    },
    vertexShader:`uniform vec3 uCenter;varying vec2 vP;varying float vX;
      void main(){vP=position.xz;vX=uCenter.x+position.x;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uTime,uTrain,uRadius;uniform vec4 uRips[8];
      varying vec2 vP;varying float vX;
      void main(){
        float d=length(vP);
        float rim=1.0-smoothstep(uRadius*0.72,uRadius,d);
        float n=sin(d*26.0-uTime*1.4)*0.5+sin(vP.x*18.0+uTime*0.9)*0.3+sin(vP.y*22.0-uTime*0.7)*0.3;
        vec3 base=mix(vec3(0.36,0.52,0.66),vec3(0.66,0.82,0.93),0.45+0.35*n+rim*0.2);
        float rip=0.0;
        for(int i=0;i<8;i++){
          float age=uTime-uRips[i].z;
          if(uRips[i].w>0.0&&age>0.0&&age<3.0){
            float dd=length(vP-vec2(uRips[i].x,uRips[i].y));
            float r=age*0.85;
            rip+=sin((dd-r)*26.0)*exp(-age*1.6)*exp(-abs(dd-r)*4.0)*uRips[i].w;
          }
        }
        base+=vec3(0.35)*rip*0.5;
        float band=exp(-pow((vX-uTrain)/4.5,2.0));
        base+=vec3(0.5,0.6,0.7)*band*(0.55+0.4*n);
        base*=1.0-band*0.18*(0.5+0.5*sin(vP.x*44.0+uTime*9.0));
        float a=0.88*rim;
        gl_FragColor=vec4(base,clamp(a,0.0,0.92));
      }`});

  const dt=Math.min(tclock.getDelta(),.05);
  const t=tclock.elapsedTime;
  const now=performance.now()/1000;
  /* 列车 */
  if(train.state==='run'){
    train.v=speedAt(train.headX);
    train.headX+=train.v*dt;
    if(train.headX-24>28){train.state='wait';train.waitT=rand(9,14);}
  }else{
    train.waitT-=dt;
    if(train.waitT<=0){train.headX=-30;train.state='run';}
  }
  window.__diag.train=train.headX;
  const bobJoint=x=>.008*Math.abs(Math.sin(x*.55));
  cars.forEach((car,i)=>{
    const cx=carCenter(i);
    car.position.x=cx;
    car.position.y=.012*Math.sin(t*6.3+i*1.7)+bobJoint(cx);
  });
  wheelPivots.forEach(pv=>pv.rotation.z+=train.v/0.34*dt);
  glassMats.forEach(m=>{
    m.uniforms.uTime.value=t;
    m.uniforms.uTrain.value=carCenter(0);
    m.uniforms.uTrain2.value=carCenter(2);
  });
  /* 电线震动 */
  for(const w of wireObjs){
    const pos=w.geo.attributes.position;
    const bp=w.base;
    for(let i=0;i<pos.count;i++){
      const x=bp[i*3];
      const breeze=.018*Math.sin(t*.9+x*.12+w.phase);
      const win=windAt(x);
      const vib=(w.contact?.03:.09)*win*Math.sin(16*t+x*1.3);
      pos.setY(i,bp[i*3+1]+breeze+vib);
    }
    pos.needsUpdate=true;
  }
  /* 花瓣 */
  for(let i=0;i<PETALS;i++){
    const d=petalData[i];
    if(d.state==='fall'){
      d.v.y+=(-0.45-d.v.y)*2*dt;
      const windX=.4*Math.sin(t*.5+d.p.z*.14+d.ph);
      const windZ=.3*Math.sin(t*.4+d.p.x*.11+d.ph*1.7);
      d.p.x+=(windX+d.v.x)*dt;
      d.p.z+=(windZ+d.v.z)*dt;
      d.p.y+=d.v.y*dt;
      const win=windAt(d.p.x);
      if(win>.03&&Math.abs(d.p.z+10)<11){
        d.v.y+=1.6*win*dt;
        d.p.x+=2.4*win*dt;
        d.p.z+=.9*win*Math.sin(t*7+d.ph)*dt;
        d.ev.x+=2.4*win*dt;d.ev.z+=1.8*win*dt;
      }
      d.e.x+=d.ev.x*dt;d.e.y+=d.ev.y*dt;d.e.z+=d.ev.z*dt;
      if(d.p.y<.14){
        d.p.y=.14;d.state='rest';d.timer=rand(1.5,4);d.ev.set(0,0,0);
        for(const rec of puddles){
          const lx=d.p.x-rec.center.x,lz=d.p.z-rec.center.z;
          if(lx*lx+lz*lz<rec.mat.uniforms.uRadius.value*rec.mat.uniforms.uRadius.value*.8){
            if(now>rec.cool){triggerRipple(rec,lx,lz);rec.cool=now+.7;}
          }
        }
      }
    }else if(d.state==='rest'){
      d.timer-=dt;
      d.p.x+=.02*dt;
      if(d.timer<=0){d.state='fade';d.timer=.6;}
    }else if(d.state==='fade'){
      d.timer-=dt;
      d.s=Math.max(.001,d.s-dt*2.2);
      if(d.timer<=0)spawnPetal(d,false);
    }
    pdummy.position.copy(d.p);
    pdummy.rotation.copy(d.e);
    pdummy.scale.setScalar(d.s);
    pdummy.updateMatrix();
    petalMesh.setMatrixAt(i,pdummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate=true;
  /* 积水 */
  for(const rec of puddles){
    rec.mat.uniforms.uTime.value=now;
    rec.mat.uniforms.uTrain.value=carCenter(0);
  }
  /* 时钟 */
  const dte=new Date();
  const sF=dte.getSeconds()+dte.getMilliseconds()/1000;
  const secA=((sF-1+Math.min(1,sF%1/.22))/60)*Math.PI*2;
  const minA=((dte.getMinutes()+dte.getSeconds()/60)/60)*Math.PI*2;
  const hrA=(((dte.getHours()%12)+dte.getMinutes()/60)/12)*Math.PI*2;
  clockHands.forEach(ch=>{ch.sc.rotation.z=-secA;ch.mn.rotation.z=-minA;ch.hr.rotation.z=-hrA;});
  /* 道口 */
  const crossActive=train.state==='run'&&train.headX>-4&&train.headX<53;
  const target=crossActive?0:-1.32;
  barrierArm.rotation.z=lerp(barrierArm.rotation.z||-1.32,target,Math.min(1,dt*2.2));
  const blink=(t%1)<.5;
  signalLights[0].emissiveIntensity=crossActive?(blink?2.6:.12):.1;
  signalLights[1].emissiveIntensity=crossActive?(blink?.12:2.6):.1;
  /* 检票口灯 */
  const gc2=Math.floor(t/2.4)%3;
  gateLights.forEach((m,i)=>{m.emissiveIntensity=i===gc2?.9:.12;});
  /* 贩卖机灯 */
  vendMats.forEach(m=>m.emissiveIntensity=.75+.25*Math.sin(t*3.1));
  /* 云 / 云影 */
  clouds.forEach(cl=>{cl.g.position.x+=cl.v*dt;if(cl.g.position.x>75)cl.g.position.x=-75;});
  cloudShadows.forEach(cs=>{cs.sp.position.x+=cs.v*dt;if(cs.sp.position.x>45)cs.sp.position.x=-45;});
  /* 小鸟 */
  const bd=bird;
  if(bd.state==='idle'){
    bd.timer-=dt;
    if(bd.timer<=0){bd.state='flyin';bd.t=0;bd.perch=perchPick();bd.from.set(-45,rand(8,12),rand(-25,10));bd.to=bd.perch.clone();birdObj.g.visible=true;}
  }else if(bd.state==='flyin'){
    bd.t+=dt/2.8;
    const e=bd.t<.5?2*bd.t*bd.t:1-Math.pow(-2*bd.t+2,2)/2;
    birdObj.g.position.lerpVectors(bd.from,bd.to,Math.min(1,e));
    const dir=bd.to.clone().sub(bd.from);birdObj.g.rotation.y=Math.atan2(-dir.z,dir.x);
    birdObj.w1.rotation.x=Math.sin(t*12)*.9;birdObj.w2.rotation.x=-Math.sin(t*12)*.9;
    if(bd.t>=1){bd.state='perch';bd.timer=rand(8,20);}
  }else if(bd.state==='perch'){
    birdObj.g.position.set(bd.perch.x,bd.perch.y+.03+.02*Math.sin(t*2.5),bd.perch.z);
    birdObj.w1.rotation.x=lerp(birdObj.w1.rotation.x,0,dt*6);
    birdObj.w2.rotation.x=lerp(birdObj.w2.rotation.x,0,dt*6);
    bd.timer-=dt;
    if(bd.timer<=0){bd.state='flyout';bd.t=0;bd.to.set(45,rand(9,14),rand(5,30));}
  }else if(bd.state==='flyout'){
    bd.t+=dt/2.6;
    birdObj.g.position.lerpVectors(bd.perch,bd.to,Math.min(1,bd.t));
    const dir=bd.to.clone().sub(bd.perch);birdObj.g.rotation.y=Math.atan2(-dir.z,dir.x);
    birdObj.w1.rotation.x=Math.sin(t*13)*.9;birdObj.w2.rotation.x=-Math.sin(t*13)*.9;
    if(bd.t>=1){bd.state='idle';bd.timer=rand(12,30);birdObj.g.visible=false;}
  }
  controls.update();
  renderer.render(scene,camera);
}
window.__view={renderer,scene,camera,controls,train,animate,
  resize(){VW=innerWidth||VW;VH=innerHeight||VH;camera.aspect=VW/VH;camera.updateProjectionMatrix();renderer.setSize(VW,VH);renderer.render(scene,camera);}};
renderer.setAnimationLoop(animate);

}catch(e){
  window.__diag=window.__diag||{err:null,train:0};
  window.__diag.err=String(e.message||e);
  document.title='ERR: '+e.message;
  console.error(e);
}
</script>
</body>
</html>
